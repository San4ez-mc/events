# /etc/nginx/sites-available/kiro.fineko.space  (then symlink into sites-enabled)
# TLS: run `certbot --nginx -d kiro.fineko.space` after the first reload —
# certbot fills in the ssl_certificate lines and the 80 -> 443 redirect.
server {
    listen 80;
    server_name kiro.fineko.space;

    client_max_body_size 12m;

    # API goes straight to NestJS (mobile app + web both use /api/v1/*)
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the Next.js web app
    location / {
        proxy_pass http://127.0.0.1:5101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
